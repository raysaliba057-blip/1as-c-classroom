services:
  classroom:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/classroom.sqlite
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
